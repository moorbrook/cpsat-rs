[package]
name = "cpsat-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Rust bindings for Google OR-Tools CP-SAT solver"
license = "Apache-2.0"
repository = "https://github.com/moorbrook/cpsat-rs"
documentation = "https://docs.rs/cpsat-rs"
readme = "README.md"
keywords = ["optimization", "constraint", "scheduling", "or-tools", "sat"]
categories = ["algorithms", "mathematics", "science"]
exclude = [".claude/**", ".DS_Store", "rust-toolchain.toml"]

[dependencies]
prost = "0.14"
thiserror = "2"

[build-dependencies]
prost-build = "0.14"

[dev-dependencies]
proptest = "1"

[lints.rust]
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
